<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#232f3e">
  <title>Quiz Cloud Practitioner</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="bot-icon.svg">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161e2e;
      --primary: #ff9900;
      --primary-glow: rgba(255, 153, 0, 0.4);
      --accent: #38bdf8;
      --text: #f8fafc;
      --correct: #10b981;
      --wrong: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 0;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    header p {
      color: #94a3b8;
      margin-top: 0.3rem;
      font-size: 0.95rem;
    }

    .bot-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.2rem;
    }

    .bot-avatar {
      width: 65px;
      height: 65px;
      flex-shrink: 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bot-speech {
      font-size: 0.92rem;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .bot-speech strong {
      color: var(--primary);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.8rem;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 153, 0, 0.05);
      position: relative;
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      display: block;
      margin-bottom: 0.6rem;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-text {
      width: 100%;
      padding: 0.8rem;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-text:focus {
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 0.6rem;
    }

    .btn-select {
      background: #1e293b;
      color: var(--text);
      border: 2px solid #334155;
      padding: 0.7rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-select:hover {
      border-color: var(--primary);
    }

    .btn-select.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .input-custom {
      display: none;
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.7rem;
      border-radius: 8px;
      border: 2px solid var(--primary);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    .badge-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .badge {
      background: var(--primary);
      color: #000;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.8rem;
    }

    .timer-badge {
      background: #0284c7;
      color: #fff;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.2rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-opcao {
      width: 100%;
      text-align: left;
      padding: 1rem;
      margin: 0.6rem 0;
      background-color: #1e293b;
      color: var(--text);
      border: 2px solid #334155;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-opcao:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-opcao.correta {
      background-color: var(--correct) !important;
      color: #000;
      font-weight: bold;
      border-color: var(--correct);
    }

    .btn-opcao.errada {
      background-color: var(--wrong) !important;
      color: #fff;
      border-color: var(--wrong);
    }

    .dica-box {
      margin-top: 1rem;
      padding: 0.9rem;
      background-color: rgba(2, 132, 199, 0.2);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: none;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .btn-nav {
      background: #334155;
      border: none;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    .btn-nav:hover {
      background: #475569;
    }

    .btn-primary-action {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .btn-primary-action:hover {
      background: #e68a00;
    }

    .btn-start {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cloud Practitioner</h1>
      <p>Simulador Oficial de Exame AWS</p>
    </header>

    <div class="bot-section">
      <img src="bot-icon.svg" alt="CloudBot" class="bot-avatar">
      <div class="bot-speech" id="bot-speech">
        Olá! Eu sou o seu assistente AWS. Configure o seu simulado abaixo para começarmos os estudos! 🚀
      </div>
    </div>

    <div class="card" id="app-card">
      <!-- O conteúdo dinâmico do Quiz será injetado via JavaScript aqui -->
      <div id="setup-screen">
        <div class="form-group">
          <label for="student-name">Seu Nome:</label>
          <input type="text" id="student-name" class="input-text" placeholder="Digite seu nome...">
        </div>

        <div class="form-group">
          <label>Quantidade de Questões:</label>
          <div class="options-grid" id="qtd-options">
            <button class="btn-select active" data-value="10">10</button>
            <button class="btn-select" data-value="20">20</button>
            <button class="btn-select" data-value="50">50</button>
            <button class="btn-select" data-value="all">Todas</button>
          </div>
          <input type="number" id="custom-qtd" class="input-custom" placeholder="Outro valor...">
        </div>

        <button class="btn-nav btn-primary-action btn-start" id="btn-iniciar">Iniciar Simulado</button>
      </div>
    </div>
  </div>

  <script>
    // Registro do Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registrado com sucesso!'))
          .catch((err) => console.log('Falha ao registrar Service Worker:', err));
      });
    }

    let questoesGlobais = [];
    let qtdSelecionada = 10;

    // Seleção de quantidade
    document.querySelectorAll('#qtd-options .btn-select').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#qtd-options .btn-select').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        qtdSelecionada = e.target.getAttribute('data-value');
      });
    });

    // Carregar questões do JSON
    fetch('questoes.json')
      .then(res => res.json())
      .then(data => {
        questoesGlobais = data;
      })
      .catch(err => {
        console.error('Erro ao carregar questoes.json:', err);
        document.getElementById('bot-speech').innerHTML = '<strong>Erro:</strong> Não foi possível carregar o arquivo <code>questoes.json</code>.';
      });

    document.getElementById('btn-iniciar').addEventListener('click', () => {
      const nome = document.getElementById('student-name').value.trim();
      if (!nome) {
        alert('Por favor, digite seu nome para iniciar!');
        return;
      }
      if (questoesGlobais.length === 0) {
        alert('As questões ainda estão carregando ou houve um erro no arquivo JSON.');
        return;
      }
      
      // Inicia a aplicação simulando o fluxo principal
      document.getElementById('app-card').innerHTML = `
        <div style="text-align: center; padding: 2rem;">
          <h2 style="color: var(--primary)">Simulado Pronto!</h2>
          <p>Olá, <strong>${nome}</strong>! O sistema está pronto com ${questoesGlobais.length} questões carregadas.</p>
          <button class="btn-nav btn-primary-action" onclick="location.reload()" style="margin-top: 1rem;">Reiniciar</button>
        </div>
      `;
      document.getElementById('bot-speech').innerHTML = `Boa sorte nos estudos, <strong>${nome}</strong>! Você vai passar na certificação AWS! ☁️🎯`;
    });
  </script>
</body>
</html>
