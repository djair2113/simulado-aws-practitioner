<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#232f3e">
  <title> Simulado AWS Cloud Practitioner </title>
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22Simulado%20AWS%22,%22short_name%22:%22AWS%20Quiz%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22#0f172a%22,%22theme_color%22:%22#232f3e%22}">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #ff9900;
      --text: #f8fafc;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.5rem;
    }

    .btn-select {
      background: #334155;
      color: var(--text);
      border: 2px solid transparent;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-select.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #000;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: #000;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    .btn-opcao {
      width: 100%;
      text-align: left;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      background-color: #334155;
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-opcao:hover {
      border-color: var(--primary);
    }

    .btn-opcao.correta {
      background-color: var(--correct) !important;
      color: #000;
      font-weight: bold;
    }

    .btn-opcao.errada {
      background-color: var(--wrong) !important;
      color: #fff;
    }

    .dica-box {
      margin-top: 1rem;
      padding: 0.8rem;
      background-color: #0284c7;
      border-radius: 6px;
      display: none;
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
    }

    .btn-nav {
      background: var(--primary);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      width: 100%;
      padding: 0.8rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }

    .timer {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Simulado AWS Cloud Practitioner</h1>
    <p id="progresso">Configure seu simulado</p>
  </header>

  <!-- TELA INICIAL / CONFIGURAÇÃO -->
  <div class="card" id="setup-card">
    <div class="form-group">
      <label>Dificuldade:</label>
      <div class="options-grid">
        <button class="btn-select active" onclick="setOpt('dificuldade', 'todas', this)">Todas</button>
        <button class="btn-select" onclick="setOpt('dificuldade', 'Fácil', this)">Fácil</button>
        <button class="btn-select" onclick="setOpt('dificuldade', 'Médio', this)">Médio</button>
        <button class="btn-select" onclick="setOpt('dificuldade', 'Hard', this)">Hard</button>
      </div>
    </div>

    <div class="form-group">
      <label>Quantidade de Questões:</label>
      <div class="options-grid">
        <button class="btn-select" onclick="setOpt('qtd', 30, this)">30</button>
        <button class="btn-select" onclick="setOpt('qtd', 90, this)">90</button>
        <button class="btn-select active" onclick="setOpt('qtd', 'todas', this)">Todas</button>
      </div>
    </div>

    <div class="form-group">
      <label>Tempo Limite:</label>
      <div class="options-grid">
        <button class="btn-select active" onclick="setOpt('tempo', 0, this)">Sem Tempo</button>
        <button class="btn-select" onclick="setOpt('tempo', 30, this)">30 min</button>
        <button class="btn-select" onclick="setOpt('tempo', 90, this)">90 min</button>
      </div>
    </div>

    <button class="btn-nav btn-start" onclick="iniciarSimulado()">Iniciar Simulado</button>
  </div>

  <!-- TELA DO QUIZ -->
  <div class="card" id="quiz-card" style="display: none;">
    <div class="timer" id="timer-display" style="display: none;">Tempo: 00:00</div>
    <span class="badge" id="categoria">Categoria</span>
    <h3 id="pergunta">Pergunta</h3>
    <div id="opcoes"></div>
    <div class="dica-box" id="dica"></div>

    <div class="controls">
      <button class="btn-nav" id="btn-anterior" onclick="anteriorPergunta()">Anterior</button>
      <button class="btn-nav" id="btn-dica" onclick="mostrarDica()">Ver Dica</button>
      <button class="btn-nav" id="btn-proximo" onclick="proximaPergunta()">Próximo</button>
    </div>
  </div>
</div>

<script>
  let todasQuestoes = [];
  let questoesFiltradas = [];
  let indiceAtual = 0;
  let tempoRestante = 0;
  let timerInterval = null;

  let config = {
    dificuldade: 'todas',
    qtd: 'todas',
    tempo: 0
  };

  async function carregarQuestoes() {
    try {
      const resposta = await fetch('questoes.json');
      todasQuestoes = await resposta.json();
    } catch (erro) {
      alert("Erro ao carregar questoes.json");
    }
  }

  function setOpt(chave, valor, btn) {
    config[chave] = valor;
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function iniciarSimulado() {
    questoesFiltradas = [...todasQuestoes];

    if (config.dificuldade !== 'todas') {
      questoesFiltradas = questoesFiltradas.filter(q => q.dificuldade === config.dificuldade);
    }

    if (config.qtd !== 'todas') {
      questoesFiltradas = questoesFiltradas.sort(() => 0.5 - Math.random()).slice(0, config.qtd);
    }

    if (questoesFiltradas.length === 0) {
      alert("Nenhuma questão encontrada para os filtros selecionados!");
      return;
    }

    document.getElementById('setup-card').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';

    if (config.tempo > 0) {
      tempoRestante = config.tempo * 60;
      document.getElementById('timer-display').style.display = 'block';
      iniciarTimer();
    }

    indiceAtual = 0;
    exibirPergunta();
  }

  function iniciarTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      let min = Math.floor(tempoRestante / 60);
      let sec = tempoRestante % 60;
      document.getElementById('timer-display').innerText = `Tempo Restante: ${min}:${sec < 10 ? '0' : ''}${sec}`;
      if (tempoRestante <= 0) {
        clearInterval(timerInterval);
        alert("Tempo esgotado!");
      }
      tempoRestante--;
    }, 1000);
  }

  function exibirPergunta() {
    const q = questoesFiltradas[indiceAtual];
    document.getElementById('progresso').innerText = `Questão ${indiceAtual + 1} de ${questoesFiltradas.length}`;
    document.getElementById('categoria').innerText = `${q.categoria} | ${q.dificuldade}`;
    document.getElementById('pergunta').innerText = q.pergunta;
    
    const dicaBox = document.getElementById('dica');
    dicaBox.style.display = 'none';
    dicaBox.innerText = `💡 Dica: ${q.dica}`;

    const conteinerOpcoes = document.getElementById('opcoes');
    conteinerOpcoes.innerHTML = '';

    q.opcoes.forEach((opcao, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn-opcao';
      btn.innerText = opcao;
      btn.onclick = () => verificarResposta(idx, q.correta, btn);
      conteinerOpcoes.appendChild(btn);
    });

    document.getElementById('btn-anterior').disabled = indiceAtual === 0;
    document.getElementById('btn-proximo').disabled = indiceAtual === questoesFiltradas.length - 1;
  }

  function verificarResposta(selecionada, correta, elemento) {
    const botoes = document.querySelectorAll('.btn-opcao');
    botoes.forEach(b => b.disabled = true);

    if (selecionada === correta) {
      elemento.classList.add('correta');
    } else {
      elemento.classList.add('errada');
      botoes[correta].classList.add('correta');
    }
  }

  function mostrarDica() {
    document.getElementById('dica').style.display = 'block';
  }

  function proximaPergunta() {
    if (indiceAtual < questoesFiltradas.length - 1) {
      indiceAtual++;
      exibirPergunta();
    }
  }

  function anteriorPergunta() {
    if (indiceAtual > 0) {
      indiceAtual--;
      exibirPergunta();
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  carregarQuestoes();
</script>
</body>
</html>
